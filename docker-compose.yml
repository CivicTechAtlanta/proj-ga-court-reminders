name: court-reminders

services:
  floci:
    image: floci/floci:1.6.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: court-reminders_default
      FLOCI_LOG_LEVEL: info
    ports:
      - "4566:4566"
      # Floci proxies each RDS instance it starts on a port from this range
      # (first instance 7001) at its own container address. Same numbers on
      # both sides, so the port it reports is valid inside the network (the
      # Lambdas) and from this machine as localhost (`make db-url`).
      - "7001-7099:7001-7099"
    volumes:
      - /var/run/docker.sock:${DOCKER_HOST:-/var/run/docker.sock}
      - floci-data:/app/data

volumes:
  floci-data:
