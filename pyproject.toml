[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "court-reminder"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-aws-lambda-python-alpha>=2.266.0a0",
    "aws-cdk-lib>=2.263.0",
    "azure-data-tables>=12.7.0",
    "azure-functions>=1.24.0,<1.25",
    "azure-storage-queue>=12.16.0",
    "constructs>=10.8.1",
    "twilio>=9.10.1,<9.11",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest",
    "ruff",
]
integration = [
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration_twilio: Twilio SMS integration tests (require credentials)",
    "integration_azure: Azure Functions integration tests (require running function host)",
    "integration_court_db: local court DB integration tests (require make db-up)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/court_reminder"]

[tool.uv.workspace]
members = [
    "lambda",
]
